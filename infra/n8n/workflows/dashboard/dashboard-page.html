<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard de análise</title>
  <style>
    :root {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #17211e;
      background: #f1f5f3;
      --surface: #ffffff;
      --surface-soft: #f7faf9;
      --border: #d9e3df;
      --muted: #63716d;
      --primary: #087f68;
      --header: #103f37;
      --accent: #ec8b2c;
      --danger: #b42318;
      --shadow: 0 8px 24px rgba(20, 32, 29, 0.08);
    }

    * { box-sizing: border-box; }
    body { min-width: 320px; min-height: 100vh; margin: 0; background: #f1f5f3; }
    button { font: inherit; cursor: pointer; }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 10;
      color: #fff;
      background: var(--header);
      border-bottom: 4px solid var(--accent);
      box-shadow: 0 4px 14px rgba(20, 32, 29, 0.18);
    }

    .header-inner,
    .page {
      width: min(1280px, calc(100% - 32px));
      margin: 0 auto;
    }

    .header-inner {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    h1 { margin: 0; font-size: 1.2rem; }
    .subtitle { margin: 4px 0 0; color: #cfe1dc; font-size: 0.8rem; }

    .header-actions { display: flex; align-items: center; gap: 12px; }
    .status { color: #d9ebe6; font-size: 0.82rem; }

    .reload {
      width: 38px;
      height: 38px;
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 6px;
    }

    .reload:hover { background: rgba(255, 255, 255, 0.18); }
    .reload:disabled { opacity: 0.55; cursor: wait; }

    .page { padding: 24px 0 48px; }
    .feedback { min-height: 24px; color: var(--muted); font-size: 0.85rem; }
    .feedback.error { color: var(--danger); }

    .dashboard { display: grid; gap: 22px; }

    .section {
      padding: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .section-header { margin-bottom: 16px; }
    .section-header h2 { margin: 0; font-size: 1rem; }
    .section-header p { margin: 5px 0 0; color: var(--muted); font-size: 0.8rem; }

    .component-grid {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      gap: 14px;
    }

    .component {
      grid-column: span var(--span, 6);
      min-width: 0;
      padding: 16px;
      background: var(--surface-soft);
      border: 1px solid var(--border);
      border-radius: 7px;
    }

    .component h3 { margin: 0 0 12px; font-size: 0.88rem; }
    .component-subtitle { margin: -7px 0 12px; color: var(--muted); font-size: 0.74rem; }
    .component-state { padding: 18px 0; color: var(--muted); font-size: 0.82rem; }
    .component-state.error { color: var(--danger); }

    .kpi-value { margin: 4px 0; font-size: 2rem; font-weight: 750; line-height: 1; }
    .kpi-detail { margin-top: 8px; color: var(--muted); font-size: 0.75rem; }

    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    th, td { padding: 9px 10px; text-align: left; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-size: 0.72rem; font-weight: 700; }

    .bars { display: grid; gap: 10px; }
    .bar-row { display: grid; grid-template-columns: minmax(110px, 0.8fr) 2fr auto; gap: 10px; align-items: center; }
    .bar-label { overflow: hidden; font-size: 0.76rem; text-overflow: ellipsis; white-space: nowrap; }
    .bar-track { height: 9px; overflow: hidden; background: #dfe9e6; border-radius: 4px; }
    .bar-fill { height: 100%; background: var(--primary); border-radius: 4px; }
    .bar-value { min-width: 58px; text-align: right; font-size: 0.76rem; font-weight: 700; }

    .empty {
      padding: 54px 24px;
      color: var(--muted);
      text-align: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    @media (max-width: 900px) {
      .component { grid-column: span 12 !important; }
    }

    @media (max-width: 600px) {
      .header-inner, .page { width: min(100% - 20px, 1280px); }
      .status { display: none; }
      .section { padding: 14px; }
      .bar-row { grid-template-columns: 90px 1fr auto; }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <div>
        <h1>Dashboard de análise</h1>
        <p class="subtitle">Indicadores dinâmicos do CRM</p>
      </div>
      <div class="header-actions">
        <span class="status" id="status">Carregando configurações...</span>
        <button class="reload" id="reload" type="button" aria-label="Atualizar dashboard" title="Atualizar dashboard">↻</button>
      </div>
    </div>
  </header>

  <main class="page">
    <div class="feedback" id="feedback" role="status" aria-live="polite"></div>
    <div class="dashboard" id="dashboard"></div>
  </main>

  <script>
    "use strict";

    const endpoints = {
      sections: "/webhook/dashboard/sections",
      data: "/webhook/dashboard_dados"
    };

    const elements = {
      dashboard: document.querySelector("#dashboard"),
      feedback: document.querySelector("#feedback"),
      reload: document.querySelector("#reload"),
      status: document.querySelector("#status")
    };

    const formatters = {
      numero: new Intl.NumberFormat("pt-BR"),
      moeda: new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" }),
      percentual: new Intl.NumberFormat("pt-BR", { style: "percent", maximumFractionDigits: 1 }),
      data: new Intl.DateTimeFormat("pt-BR")
    };

    async function request(path, payload = {}) {
      const response = await fetch(path, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      const result = await response.json().catch(() => {
        throw new Error("A API retornou uma resposta inválida.");
      });

      if (!response.ok || result.sucesso === false) {
        throw new Error(result.erro || `Falha HTTP ${response.status}.`);
      }

      return result;
    }

    function formatValue(value, format = "texto") {
      if (value === null || value === undefined || value === "") return "-";
      if (format === "numero") return formatters.numero.format(Number(value) || 0);
      if (format === "moeda") return formatters.moeda.format(Number(value) || 0);
      if (format === "percentual") return formatters.percentual.format(Number(value) || 0);
      if (format === "data") {
        const date = new Date(value);
        return Number.isNaN(date.getTime()) ? "-" : formatters.data.format(date);
      }
      return String(value);
    }

    function element(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function renderState(container, message, isError = false) {
      container.replaceChildren(element("div", `component-state${isError ? " error" : ""}`, message));
    }

    async function loadComponent(definition, container) {
      renderState(container, "Carregando dados...");

      try {
        const response = await request(endpoints.data, {
          identificador: definition.id,
          consulta: definition.consulta
        });
        const rows = Array.isArray(response.dados) ? response.dados : [];

        if (!rows.length) {
          renderState(container, definition.mensagem_vazio || "Nenhum dado encontrado.");
          return;
        }

        if (definition.tipo === "kpi") renderKpi(definition, rows, container);
        else if (definition.tipo === "tabela") renderTable(definition, rows, container);
        else if (definition.tipo === "barras") renderBars(definition, rows, container);
        else renderState(container, `Tipo de componente não suportado: ${definition.tipo}`, true);
      } catch (error) {
        renderState(container, error.message || "Erro ao carregar dados.", true);
      }
    }

    function renderKpi(definition, rows, container) {
      const value = rows[0]?.[definition.campo_valor];
      container.replaceChildren(
        element("div", "kpi-value", formatValue(value, definition.formato)),
        element("div", "kpi-detail", definition.detalhe || "")
      );
    }

    function renderTable(definition, rows, container) {
      const columns = Array.isArray(definition.colunas) ? definition.colunas : [];
      const table = document.createElement("table");
      const head = document.createElement("thead");
      const headRow = document.createElement("tr");
      const body = document.createElement("tbody");

      for (const column of columns) {
        headRow.append(element("th", "", column.titulo || column.campo));
      }

      for (const row of rows) {
        const tr = document.createElement("tr");
        for (const column of columns) {
          tr.append(element("td", "", formatValue(row[column.campo], column.formato)));
        }
        body.append(tr);
      }

      head.append(headRow);
      table.append(head, body);
      const wrap = element("div", "table-wrap");
      wrap.append(table);
      container.replaceChildren(wrap);
    }

    function renderBars(definition, rows, container) {
      const values = rows.map((row) => Number(row[definition.campo_valor]) || 0);
      const max = Math.max(...values, 1);
      const bars = element("div", "bars");

      rows.forEach((row, index) => {
        const line = element("div", "bar-row");
        const label = element("div", "bar-label", formatValue(row[definition.campo_categoria]));
        const track = element("div", "bar-track");
        const fill = element("div", "bar-fill");
        const value = element("div", "bar-value", formatValue(values[index], definition.formato));
        fill.style.width = `${Math.max(2, (values[index] / max) * 100)}%`;
        track.append(fill);
        line.append(label, track, value);
        bars.append(line);
      });

      container.replaceChildren(bars);
    }

    function renderSection(section) {
      const wrapper = element("section", "section");
      const header = element("header", "section-header");
      header.append(
        element("h2", "", section.nome),
        element("p", "", section.descricao || "")
      );

      const grid = element("div", "component-grid");
      wrapper.append(header, grid);

      for (const component of section.componentes) {
        const card = element("article", "component");
        const content = element("div", "component-content");
        const span = Math.min(12, Math.max(3, Number(component.largura) || 6));
        card.style.setProperty("--span", span);
        card.append(element("h3", "", component.titulo || component.id));
        if (component.subtitulo) {
          card.append(element("p", "component-subtitle", component.subtitulo));
        }
        card.append(content);
        grid.append(card);
        loadComponent(component, content);
      }

      return wrapper;
    }

    async function loadDashboard() {
      elements.reload.disabled = true;
      elements.feedback.textContent = "";
      elements.feedback.className = "feedback";
      elements.status.textContent = "Carregando configurações...";
      elements.dashboard.replaceChildren();

      try {
        const response = await request(endpoints.sections);
        const sections = Array.isArray(response.secoes) ? response.secoes : [];

        if (!sections.length) {
          elements.dashboard.append(element("div", "empty", "Nenhuma seção válida foi cadastrada."));
        } else {
          for (const section of sections) {
            elements.dashboard.append(renderSection(section));
          }
        }

        if (Array.isArray(response.erros) && response.erros.length) {
          elements.feedback.textContent = `${response.erros.length} seção(ões) foram ignoradas por configuração inválida.`;
          elements.feedback.className = "feedback error";
        }

        elements.status.textContent = `${sections.length} seção(ões) carregada(s)`;
      } catch (error) {
        elements.dashboard.append(element("div", "empty", "Não foi possível carregar o dashboard."));
        elements.feedback.textContent = error.message || "Falha no carregamento.";
        elements.feedback.className = "feedback error";
        elements.status.textContent = "Falha ao carregar";
      } finally {
        elements.reload.disabled = false;
      }
    }

    elements.reload.addEventListener("click", loadDashboard);
    loadDashboard();
  </script>
</body>
</html>
